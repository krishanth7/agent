[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nifty-agent-api"
version = "0.2.0"
description = "Backend foundation for the NIFTY Options Trading Agent dashboard."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    # Angel One requires a TOTP on every login. RFC 6238 is short enough to
    # hand-roll, which is exactly why it should not be: a subtly wrong
    # implementation fails at the 30-second boundary, intermittently, in
    # production. pyotp is the reference implementation and has no transitive
    # dependencies of its own.
    "pyotp>=2.9.0",
    # The SmartAPI feed is a binary WebSocket. `websockets` rather than
    # httpx-ws because it is the library the official SDK targets and the one
    # the published reconnect semantics are written against.
    "websockets>=13.0",
    # Persistence. SQLAlchemy's asyncio support is an extra rather than a
    # separate package; asyncpg is the driver, and greenlet is what lets
    # SQLAlchemy bridge its sync internals into an async call stack.
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Windows ships no IANA time-zone database, so `zoneinfo` cannot resolve
    # "Asia/Kolkata" without this. Required for correct exchange-local dates on
    # any host that lacks a system tzdata.
    "tzdata>=2024.2; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "ASYNC",
    "S",    # bandit
    "T20",  # no print()
]
ignore = [
    # FastAPI's dependency-injection idiom is `x = Depends(...)` in the
    # signature, which B008 flags as a function call in a default argument.
    "B008",
]

[tool.ruff.lint.isort]
# `alembic/` is a directory in this project, so ruff would otherwise infer that
# the `alembic` package being imported is first-party and sort it alongside
# `app`. It is the third-party migration library.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use `assert`, which bandit flags as S101.
#
# S105/S106 flag string literals that look like hardcoded credentials. In the
# broker fixtures they are exactly that — and deliberately so: the suite needs
# a token-shaped value to assert that tokens are wrapped, redacted and never
# echoed into a request body. They are obvious fakes ("fake-jwt-token"), and a
# secret scan over the repository must not treat them as findings either.
"tests/*" = ["S101", "S105", "S106"]

# Migration bodies are produced by `alembic revision --autogenerate`, which
# emits each CHECK constraint as one long SQL string literal. Ruff cannot split
# a string literal, so E501 there would mean hand-rewrapping generated code
# after every autogenerate run, forever. Only the line-length rule is relaxed —
# every other rule still applies to migrations.
"alembic/versions/*" = ["E501"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
plugins = []

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true
