# Alembic configuration.
#
# NOTE: there is deliberately no `sqlalchemy.url` here. The connection string
# carries a password, and this file is committed. `alembic/env.py` builds the
# URL from the same pydantic-settings object the application uses, so there is
# exactly one place that knows how to reach the database.

[alembic]
script_location = alembic
prepend_sys_path = .

# Timestamped, slugged revision filenames. The default is a bare hash, which
# makes `ls versions/` useless for understanding migration order at a glance.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Migrations are authored and applied in UTC so ordering is unambiguous
# regardless of where a developer or a deployment runner happens to be.
timezone = UTC

# Autogenerated migrations are formatted on write so that a generated file and
# a hand-written one are indistinguishable in review, and so `ruff format
# --check` over the repo stays clean.
#
# The hook type is `exec`, not `console_scripts`: ruff ships a precompiled
# binary and declares no Python entry points, so `console_scripts` cannot
# resolve it. `exec` requires `ruff` on PATH, which activating the virtualenv
# provides.
[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
